name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Writing rules
        run: node scripts/check-writing.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and golden tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End to end tests
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
